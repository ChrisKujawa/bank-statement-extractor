[project]
name = "bank-statement-extractor"
version = "0.1.0"
description = "Extract and categorize ING Bank DE statement transactions."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "pypdf>=5,<7",
]

[project.scripts]
bank-statement-extractor = "bank_statement_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pytest==9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-ruff>=0.5",
  "ruff==0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
  "--cov=bank_statement_extractor",
  "--cov-branch",
  "--cov-report=html",
  "--cov-report=term",
  "--ruff",
  "--ruff-format",
]

[tool.mypy]
strict = true
